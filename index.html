<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra App Store</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        h2 { border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-top: 25px; color: #e2e8f0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 10px; text-align: center; }
        .card img { width: 65px; height: 65px; border-radius: 14px; object-fit: cover; }
        .card h3 { font-size: 13px; margin: 8px 0 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .card p { font-size: 10px; color: #8b949e; margin: 0 0 8px; }
        .btn { display: block; background: #238636; color: white; text-decoration: none; padding: 6px 0; border-radius: 6px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🚀 ULTRA APP STORE</h1>

    <!-- 1. CATEGORY: 5G -->
    <h2>5g</h2>
    <div class="grid">
        <div class="card">
            <img src="ICON_LINK_HERE">
            <h3>5G 4G Force LTE</h3>
            <p>v1.6.0 | 11.5MB</p>
            <a href="TELEGRAM_LINK_HERE" class="btn">DOWNLOAD</a>
        </div>
    </div>

    <!-- 2. CATEGORY: AI -->
    <h2>Ai</h2>
    <div class="grid">
        <div class="card">
            <img src="ICON_LINK_HERE">
            <h3>Perplexity MAX+</h3>
            <p>v2.86.0 | 119MB</p>
            <a href="TELEGRAM_LINK_HERE" class="btn">DOWNLOAD</a>
        </div>
        <div class="card">
            <img src="ICON_LINK_HERE">
            <h3>Claude</h3>
            <p>v1.26.0 | 18MB</p>
            <a href="TELEGRAM_LINK_HERE" class="btn">DOWNLOAD</a>
        </div>
    </div>

    <!-- 3. CATEGORY: AI VIDEO -->
    <h2>Ai Video</h2>
    <div class="grid">
        <div class="card">
            <img src="ICON_LINK_HERE">
            <h3>VideoGPT</h3>
            <p>v3.1 | 128MB</p>
            <a href="TELEGRAM_LINK_HERE" class="btn">DOWNLOAD</a>
        </div>
    </div>

</body>
</html>
